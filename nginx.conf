server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Note: add_header inside a location replaces the server-level ones, so every location repeats
  # the security headers (scripts/build.mjs checks this CSP matches its own).
  set $csp "default-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";

  gzip on;
  gzip_vary on;      # caches/CDNs keep compressed and plain copies apart
  gzip_proxied any;  # still compress behind a proxy or CDN
  gzip_types text/css application/javascript text/javascript image/svg+xml application/xml application/json text/plain;

  # Pages. Clean URLs: /about → about.html (same routing as GitHub Pages / the current live site).
  # HTML always revalidates, so a new release is picked up on the next visit.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp always;
  }
  # CSS/JS/SVG carry a content hash in their name (site.<hash>.css, main.<hash>.js): cache forever.
  location ~* "^/assets/.+\.[0-9a-f]{10}\.(css|js|svg)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp always;
  }
  # Fonts, images and the release manifest.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp always;
  }
  error_page 404 /404.html;
}
