<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="robots" content="{{robots}}" />
  <link rel="canonical" href="{{siteUrl}}{{path}}" />
  <meta name="theme-color" content="#003943" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="finperiti" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:url" content="{{siteUrl}}{{path}}" />
  <meta property="og:title" content="{{ogTitle}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="{{siteUrl}}/assets/img/og/finperiti-og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ogTitle}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{siteUrl}}/assets/img/og/finperiti-og.jpg" />

  <link rel="icon" type="image/svg+xml" href="/assets/img/brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/brand/favicon-180.png" />

  <!-- Self-hosted fonts (Manrope + JetBrains Mono, variable, latin) — no third-party requests -->
  <link rel="preload" href="/assets/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- One minified, content-hashed stylesheet (built from assets/css/*.css by scripts/build.mjs) -->
  <link rel="stylesheet" href="{{stylesheet}}" />

{{jsonld}}
</head>
